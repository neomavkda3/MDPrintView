<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- CSP allows 'unsafe-inline' for script + style because Mermaid generates
         inline <style> and <script> elements when rendering diagrams. img-src
         allows data: for Mermaid's inline SVG icons. font-src allows data: for
         KaTeX font fallback. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
    <title>MDPrintView preview</title>
    <link rel="stylesheet" href="preview.css">
    <link rel="stylesheet" href="katex.min.css">
    <script src="mermaid.min.js"></script>
    <script src="katex.min.js"></script>
    <script src="auto-render.min.js"></script>
    <script src="pagebreak.js"></script>
</head>
<body class="screen">
    <main id="content"></main>
</body>
</html>
