name: mdview

options:
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: net.cmagsisi
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown.git
    from: "0.6.0"

targets:
  mdview:
    type: application
    platform: macOS
    sources:
      - path: mdview
    dependencies:
      - package: Markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cmagsisi.mdview
        INFOPLIST_FILE: mdview/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: mdview/mdview.entitlements

  mdviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: mdviewTests
    dependencies:
      - target: mdview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cmagsisi.mdviewTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/mdview.app/Contents/MacOS/mdview
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  mdview:
    build:
      targets:
        mdview: all
        mdviewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - mdviewTests
