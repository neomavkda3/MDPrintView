name: MDPrintView

options:
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: net.cmagsisi
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown.git
    from: "0.6.0"

targets:
  MDPrintView:
    type: application
    platform: macOS
    sources:
      - path: MDPrintView
    dependencies:
      - package: Markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cmagsisi.MDPrintView
        INFOPLIST_FILE: MDPrintView/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          # Debug uses entitlements WITHOUT app-sandbox because ad-hoc-signed
          # sandboxed apps fail to spawn the WKWebView WebContent helper on
          # macOS 26, leaving the preview pane empty.
          CODE_SIGN_ENTITLEMENTS: MDPrintView/MDPrintView-debug.entitlements
        Release:
          # Release (App Store archive) keeps full sandbox + user-selected
          # files + bookmarks entitlements.
          CODE_SIGN_ENTITLEMENTS: MDPrintView/MDPrintView.entitlements

  MDPrintViewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MDPrintViewTests
    dependencies:
      - target: MDPrintView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cmagsisi.MDPrintViewTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MDPrintView.app/Contents/MacOS/MDPrintView
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MDPrintView:
    build:
      targets:
        MDPrintView: all
        MDPrintViewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDPrintViewTests
