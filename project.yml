name: MDPrintView

options:
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: net.cmagsisi
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown.git
    from: "0.6.0"
  # Sparkle 2 — self-update for the OSS (non-MAS) Developer-ID build.
  # macOS 26 supported as of 2.8.x. Pin to the 2.x major; minors add
  # features without breaking integrations.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.0"

targets:
  MDPrintView:
    type: application
    platform: macOS
    sources:
      - path: MDPrintView
    dependencies:
      - package: Markdown
        product: Markdown
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cmagsisi.MDPrintView
        INFOPLIST_FILE: MDPrintView/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          # Debug uses entitlements WITHOUT app-sandbox because ad-hoc-signed
          # sandboxed apps fail to spawn the WKWebView WebContent helper on
          # macOS 26, leaving the preview pane empty.
          CODE_SIGN_ENTITLEMENTS: MDPrintView/MDPrintView-debug.entitlements
        Release:
          # Release is the OSS (Developer ID) build — NOT sandboxed.
          # Sparkle works without the XPC service complexity, Developer ID
          # is what Gatekeeper expects for non-MAS distribution, and the
          # entitlements file is intentionally empty.
          #
          # A separate Release-MAS config (sandboxed, no Sparkle) will be
          # added when the Mac App Store SKU ships.
          CODE_SIGN_ENTITLEMENTS: MDPrintView/MDPrintView.entitlements
          # Sign with the Developer ID Application certificate. Using the
          # generic family name ("Developer ID Application") lets the
          # build pick the right one from any Keychain that has exactly
          # one installed — works locally and on CI runners alike.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 6W4NLME2QR
          # Notarization requires hardened runtime + secure timestamp.
          # ENABLE_HARDENED_RUNTIME=YES is already inherited from base.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  MDPrintViewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MDPrintViewTests
    dependencies:
      - target: MDPrintView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cmagsisi.MDPrintViewTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MDPrintView.app/Contents/MacOS/MDPrintView
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MDPrintView:
    build:
      targets:
        MDPrintView: all
        MDPrintViewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDPrintViewTests
